stages:
  - build
  - quality
  - test

.app_image:
  image:
    name: $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH
    entrypoint: [ "ash", "-c" ]
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules
    - key:
        files:
          - composer.lock
      paths:
        - vendor

docker-build:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TARGET="$CI_COMMIT_BRANCH"
        VERSION="${CI_COMMIT_BRANCH}_${CI_COMMIT_SHORT_SHA}"
      elif [ "$CI_COMMIT_BRANCH" = "stage" ]; then
        TARGET="$CI_COMMIT_BRANCH"
        VERSION="${CI_COMMIT_BRANCH}_${CI_COMMIT_SHORT_SHA}"
      elif [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        TARGET="$CI_COMMIT_BRANCH"
        VERSION="${CI_COMMIT_BRANCH}_${CI_COMMIT_SHORT_SHA}"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        TARGET="$CI_COMMIT_TAG"
        VERSION="$CI_COMMIT_TAG"
      else
        TARGET="$CI_COMMIT_REF_SLUG"
        VERSION="${CI_COMMIT_BRANCH}_${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build $ADD_HOST_FLAGS --tag $CI_REGISTRY_IMAGE:$TARGET --push --build-arg APP_VERSION=$VERSION .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE:$TARGET $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi

pint:
  extends: .app_image
  stage: quality
  allow_failure: true
  script:
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
    - composer format:check

prettier:
  extends: .app_image
  stage: quality
  allow_failure: true
  script:
    - npm ci
    - npm run format:check

eslint:
  extends: .app_image
  stage: quality
  allow_failure: true
  script:
    - npm ci
    - npm run lint:check

test:
  extends: .app_image
  stage: test
  script:
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
    - cp .env.example .env
    - touch database/database.sqlite
    - php artisan key:generate
    - php artisan ziggy:generate
    - npm ci
    - npm run build
    - ./vendor/bin/pest
